name: Verify and publish demo
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: treedatagrid-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test toolchains
        run: |
          npm install --global typescript@5.8.3
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test Core, declarations, HTTP transport and browser behavior
        shell: bash
        run: |
          npm test
          npm run typecheck
          npm run test:http
          python tests/browser.py
      - name: Stage the static site
        run: |
          mkdir -p _site
          cp index.html README.md LICENSE THIRD_PARTY_NOTICES.md _site/
          cp -R packages samples dist docs releases _site/
          touch _site/.nojekyll
          printf '{"commit":"%s","run":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > _site/build.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-site
          path: _site/
          include-hidden-files: true
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: verification/
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://wieslawsoltes.github.io/TreeDataGridWeb/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-site
          path: _site
      - name: Read Pages publishing configuration
        id: config
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" > /tmp/pages.json
          cat /tmp/pages.json
          echo "type=$(jq -r '.build_type // "legacy"' /tmp/pages.json)" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r '.html_url' /tmp/pages.json)" >> "$GITHUB_OUTPUT"
      - name: Publish the verified revision to the configured Pages branch
        if: steps.config.outputs.type == 'legacy'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          source_branch=$(jq -r '.source.branch' /tmp/pages.json)
          source_path=$(jq -r '.source.path' /tmp/pages.json)
          test "$source_path" = '/'
          case "$source_branch" in
            gh-pages) git push origin HEAD:refs/heads/gh-pages ;;
            main) test "$(git rev-parse HEAD)" = "$GITHUB_SHA" ;;
            *) echo 'Configure Pages to publish gh-pages / (root), or use GitHub Actions.'; exit 1 ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          for attempt in $(seq 1 36); do
            gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" > /tmp/build.json
            status=$(jq -r .status /tmp/build.json)
            commit=$(jq -r .commit /tmp/build.json)
            echo "Pages build: $status ($commit)"
            if [ "$commit" = "$GITHUB_SHA" ] && [ "$status" = 'built' ]; then exit 0; fi
            if [ "$commit" = "$GITHUB_SHA" ] && [ "$status" = 'errored' ]; then cat /tmp/build.json; exit 1; fi
            sleep 5
          done
          echo 'Pages build did not finish within the polling window.'; exit 1
      - uses: actions/upload-pages-artifact@v3
        if: steps.config.outputs.type == 'workflow'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.config.outputs.type == 'workflow'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the public HTTPS demo in Chromium
        env:
          DEMO_URL: ${{ steps.config.outputs.url }}
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python tests/hosted.py "$DEMO_URL"
      - name: Upload hosted-demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-demo-verification
          path: verification/hosted/
